name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      major_release:
        description: "Mark this build as a major update"
        type: boolean
        required: false
        default: false

# Serialize reservations; GitHub may replace an older pending run in this group.
concurrency:
  group: hidayah-android-version-reservation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reserve:
    name: Reserve Android version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      attempt: ${{ steps.version.outputs.attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify version allocation logic
        run: python3 -m unittest discover -s scripts -p 'test_build_version.py'
      - name: Reserve build version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR_RELEASE: ${{ inputs.major_release || false }}
        run: python3 scripts/build_version.py

  build:
    name: Build and test debug APK
    needs: reserve
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require a fresh version for this attempt
        env:
          RESERVED_ATTEMPT: ${{ needs.reserve.outputs.attempt }}
        run: |
          if [[ "$RESERVED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'Re-run all jobs to reserve a new version; do not re-run only failed jobs.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Restore Firebase config and debug signing key
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_JSON" || -z "$DEBUG_KEYSTORE" ]]; then
            echo 'Required Actions secrets are missing.' >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_JSON" > app/google-services.json
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Run JVM tests and build APK
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2048m -PhidayahVersionName=${{ needs.reserve.outputs.name }} -PhidayahVersionCode=${{ needs.reserve.outputs.code }} :app:testDebugUnitTest :app:assembleDebug

      - name: Verify and prepare APK
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.reserve.outputs.name }}
          EXPECTED_CODE: ${{ needs.reserve.outputs.code }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify --verbose "$APK"
          BADGING=$("$TOOLS/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep '^package:'
          VERSION=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          [[ "$VERSION" == "$EXPECTED_VERSION" && "$CODE" == "$EXPECTED_CODE" ]]
          mkdir -p ci-output
          cp "$APK" "ci-output/Hidayah-${VERSION}-debug.apk"
          sha256sum "ci-output/Hidayah-${VERSION}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hidayah-debug-APK
          path: ci-output/*.apk
          if-no-files-found: error
          retention-days: 30
